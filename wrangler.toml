name = "world-canvas"
main = "src/index.js"
compatibility_date = "2025-04-01"
workers_dev = true

[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World"]

[[routes]]
pattern = "canvas.findhappyman.com"
custom_domain = true

# AI 画笔用 Cloudflare Workers AI，不需要额外的 API key
[ai]
binding = "AI"

[vars]
AI_ENABLED = "0"  # 暂时下线：生成太慢（常超过 70 秒），管理员仍可用
WANDER = "0"      # AI 画家小游：设为 "1" 后它会定时醒来自己画；关着时管理员也能在「···」面板里让它出门一次
# WANDER_EVERY = "20"  # 有人在线时，大约每多少分钟出门一次
# WANDER_IDLE = "120"  # 没人在线时
# WANDER_DAILY = "12"  # 每天最多画几幅（Workers AI 免费额度每天 1 万 neurons，和 AI 画笔共用）
