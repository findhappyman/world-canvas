<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>无界画布 · 全世界同一张纸</title>
<meta name="description" content="一张无限大的画布，全世界的人在上面一起画画。">
<style>
  :root {
    --paper: #fbfaf7; --ink: #1b1b1f; --muted: #6f6e77; --line: #e6e3dc;
    --card: rgba(255,255,255,.88); --shadow: 0 6px 24px rgba(30,25,15,.10), 0 1px 2px rgba(30,25,15,.08);
    --accent: #0090ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  canvas.hand { cursor: grab; } canvas.flag { cursor: pointer; } canvas.grabbing { cursor: grabbing; }

  .card { background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #brand { position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); padding: 10px 14px; }
  #brand h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .04em; }
  #brand .sub { margin-top: 2px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #me { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #me i { width: 8px; height: 8px; border-radius: 50%; background: #bbb; display: inline-block; }
  #me b { color: var(--ink); font-weight: 600; text-decoration: underline dotted; text-underline-offset: 3px; }

  #nav { position: fixed; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top));
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; }
  #nav button { padding: 9px 13px; font-size: 13px; font-weight: 550; white-space: nowrap; }
  #nav button:hover { background: #fff; }
  #nav b.echo { display: inline-block; min-width: 17px; height: 17px; margin-left: 5px; padding: 0 5px; border-radius: 9px;
    background: #e5484d; color: #fff; font-size: 11px; line-height: 17px; text-align: center; vertical-align: 1px; }
  #nav b.echo[hidden] { display: none; }
  #online .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #30a46c; margin-right: 6px;
    box-shadow: 0 0 0 3px rgba(48,164,108,.18); }
  #online.off .dot { background: #e5484d; box-shadow: 0 0 0 3px rgba(229,72,77,.18); }
  #online .go { color: #30a46c; margin-left: 4px; }
  #online.busy .dot { animation: busy 1s ease-in-out infinite; }
  @keyframes busy { 0%, 100% { box-shadow: 0 0 0 3px rgba(48,164,108,.18); } 50% { box-shadow: 0 0 0 7px rgba(48,164,108,.32); transform: scale(1.2); } }

  #zoom { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; overflow: hidden; }
  #zoom button { width: 38px; height: 36px; font-size: 18px; }
  #zoom button + button { border-top: 1px solid var(--line); }
  #zoom button:hover { background: #fff; }

  #bar { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px; padding: 6px 8px; max-width: calc(100vw - 24px); }
  #bar .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; flex: none; }
  .tool { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; }
  .tool:hover { background: rgba(0,0,0,.05); }
  .tool[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .tool svg { width: 20px; height: 20px; }
  .sw { width: 26px; height: 26px; border-radius: 50%; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); transition: transform .12s; }
  .sw[aria-pressed="true"] { transform: scale(1.18); box-shadow: 0 0 0 2px var(--ink); }
  .sz { width: 30px; height: 38px; display: grid; place-items: center; flex: none; border-radius: 8px; }
  .sz i { display: block; border-radius: 50%; background: var(--ink); opacity: .35; }
  .sz[aria-pressed="true"] i { opacity: 1; }
  #colors { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; padding: 4px 2px; }
  #colors::-webkit-scrollbar { display: none; }

  #mod { position: fixed; right: max(12px, env(safe-area-inset-right)); top: 64px; width: min(360px, calc(100vw - 24px));
    max-height: calc(100vh - 160px); display: flex; flex-direction: column; overflow: hidden; }
  #mod[hidden], #btnMod[hidden] { display: none; }
  #mod header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  #modClose { width: 28px; height: 28px; border-radius: 8px; color: var(--muted); }
  #mod header button:hover { background: rgba(0,0,0,.05); }
  #modTabs { display: flex; gap: 4px; }
  #modTabs button { padding: 5px 10px; border-radius: 8px; font-weight: 600; color: var(--muted); }
  #modTabs button.on { background: rgba(0,0,0,.06); color: var(--ink); }
  #modList { overflow-y: auto; }
  #modList .warn { color: #d93d42; font-weight: 600; }
  #modList .row { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  #modList .row:last-child { border-bottom: 0; }
  #modList .info { flex: 1; min-width: 0; }
  #modList .info b { font-weight: 600; font-variant-numeric: tabular-nums; }
  #modList .info div { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #modList button { padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: #fff; flex: none; }
  #modList button.go { background: var(--ink); color: #fff; border-color: var(--ink); }
  #modList .empty { padding: 22px 14px; color: var(--muted); text-align: center; }
  #ai { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px); transform: translateX(-50%);
    width: min(420px, calc(100vw - 24px)); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  #ai[hidden] { display: none; }
  #ai textarea { font: inherit; font-size: 15px; resize: none; height: 64px; padding: 9px 11px; border-radius: 10px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); outline: none; user-select: text; -webkit-user-select: text; }
  #ai textarea:focus { border-color: var(--accent); }
  #ai .row { display: flex; align-items: center; gap: 8px; }
  #ai .hint { flex: 1; color: var(--muted); font-size: 12px; }
  #ai .sugs { display: flex; gap: 6px; flex-wrap: wrap; }
  #ai .sugs button { font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--muted); }
  #aiGo { padding: 8px 14px; border-radius: 10px; background: var(--ink); color: #fff; font-weight: 600; flex: none; }
  #aiGo:disabled { opacity: .5; cursor: default; }
  #tAI[hidden] { display: none; }
  #tAI { font-size: 13px; font-weight: 700; width: auto; padding: 0 12px 0 10px; gap: 4px; grid-auto-flow: column; color: #fff;
    background: linear-gradient(135deg, #7b61ff, #e5559b); box-shadow: 0 2px 10px rgba(123,97,255,.35); margin-right: 2px; }
  #tAI:hover { filter: brightness(1.06); background: linear-gradient(135deg, #7b61ff, #e5559b); }
  #tAI[aria-pressed="true"] { background: linear-gradient(135deg, #5a3fe0, #c93d80); box-shadow: 0 0 0 2px #fff, 0 0 0 4px #7b61ff; }
  #btnMore { padding: 9px 12px; font-weight: 700; letter-spacing: .08em; }
  #more { position: fixed; z-index: 4; padding: 6px; display: flex; flex-direction: column; min-width: 190px; }
  #more[hidden] { display: none; }
  #more button { text-align: left; padding: 10px 12px; border-radius: 9px; font-size: 13px; white-space: nowrap; }
  #more button:hover { background: rgba(0,0,0,.05); }
  #more button small { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
  #flagOn { position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 3;
    padding: 8px 14px; font-size: 13px; font-weight: 600; background: #fff1f1; border-color: #f3c4c5; color: #b4282d; white-space: nowrap; }
  #flagOn[hidden] { display: none; }
  #agent { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(480px, calc(100vw - 24px));
    max-height: calc(100vh - 40px); overflow-y: auto; padding: 18px; user-select: text; -webkit-user-select: text; z-index: 5; }
  #agent[hidden] { display: none; }
  #agent h2 { margin: 0 0 6px; font-size: 16px; }
  #agent p { margin: 6px 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
  #agent .field { margin-top: 12px; }
  #agent .field b { display: block; font-size: 12px; margin-bottom: 4px; }
  #agent .copy { display: flex; gap: 6px; }
  #agent code, #agent pre { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #fff; border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 9px; overflow-x: auto; white-space: pre; flex: 1; min-width: 0; margin: 0; }
  #agent button.cp { flex: none; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 12px; font-weight: 600; }
  #agent .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  #agent .acts button { padding: 8px 14px; border-radius: 10px; font-weight: 600; border: 1px solid var(--line); background: #fff; }
  #agent .acts button.go { background: var(--ink); color: #fff; border-color: var(--ink); }
  #toast { position: fixed; left: 50%; bottom: 86px; transform: translate(-50%, 8px); padding: 9px 14px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; max-width: calc(100vw - 24px);
    overflow: hidden; text-overflow: ellipsis; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 560px) {
    #nav button span.l { display: none; }
    #brand h1 { font-size: 14px; }
    #zoom { display: none; }
    .sw { width: 24px; height: 24px; }
    /* 手机上工具栏放不下一行：颜色单独一行放上面 */
    #bar { flex-wrap: wrap; justify-content: center; row-gap: 2px; width: calc(100vw - 24px); }
    #colors { order: -1; flex: 1 0 100%; justify-content: center; }
    #bar > .sep:first-of-type { display: none; }
    /* 手机上左上角只留一行：名字；坐标藏起来，Agent 入口在「···」里 */
    #brand { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
    #brand .sub { display: none; }
    #me { margin-top: 0; }
    /* 「···」和名字同一行，放右上角 */
    #btnMore { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); padding: 8px 12px; }
    /* 导航按钮放在名字下面一行，放不下就横向滑动；留出上下边距，免得阴影被裁成一条底色 */
    #nav { top: calc(max(12px, env(safe-area-inset-top)) + 38px); left: 0; right: 0; max-width: none; justify-content: flex-start;
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 6px max(12px, env(safe-area-inset-right)) 12px max(12px, env(safe-area-inset-left)); gap: 6px; }
    #nav::-webkit-scrollbar { display: none; }
    #nav { pointer-events: none; }
    #nav button { flex: none; padding: 8px 12px; pointer-events: auto; }
    #nav .card { box-shadow: 0 2px 8px rgba(30,25,15,.08), 0 1px 2px rgba(30,25,15,.06); }
    #flagOn { top: calc(max(12px, env(safe-area-inset-top)) + 96px); }
    #mod { top: calc(max(12px, env(safe-area-inset-top)) + 96px); max-height: calc(100vh - 240px); }
    #bar { gap: 2px; padding: 6px; }
    #tAI { padding: 0 10px 0 8px; }
    .sz { width: 26px; }
    #ai { bottom: calc(max(16px, env(safe-area-inset-bottom)) + 100px); }
    #toast { bottom: 128px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="brand" class="card">
  <h1>无界画布</h1>
  <div class="sub" id="pos">x 0 · y 0 · 100%</div>
  <button id="me" title="点击改名"><i></i>你是 <b id="myname"></b></button>
</div>

<div id="nav">
  <button id="online" class="card off" title="飞到一位在线的人身边"><span class="dot"></span><span id="count">连接中…</span></button>
  <button id="btnMine" class="card" title="回到我画过的地方，再点一次看上一幅 (M)">我的画<b class="echo" id="echoN" hidden></b></button>
  <button id="btnRandom" class="card" title="随机飞到别人的一幅作品 (R)"><span class="l">随便</span>逛逛</button>
  <button id="btnEmpty" class="card" title="找一块没人画过的地方">找空地</button>
  <button id="btnShare" class="card" title="复制当前位置的链接">分享<span class="l">位置</span></button>
  <button id="btnMod" class="card" hidden title="查看被处罚的人，恢复误伤">管理</button>
  <button id="btnMore" class="card" title="更多" aria-label="更多" aria-haspopup="true" aria-expanded="false">···</button>
</div>

<div id="more" class="card" hidden role="menu">
  <button id="btnAgent" role="menuitem">🤖 接入我的 Agent<small>让 Claude、ChatGPT 等 AI 助手来画</small></button>
  <button id="btnFlag" role="menuitem">🚩 举报乱涂<small>点一下乱涂的笔画，把它藏起来</small></button>
</div>
<button id="flagOn" class="card" hidden>🚩 举报模式：点一下乱涂的笔画 · 点这里退出</button>

<div id="zoom" class="card">
  <button id="zin" aria-label="放大">+</button>
  <button id="zout" aria-label="缩小">−</button>
</div>

<div id="bar" class="card">
  <button class="tool" id="tAI" hidden aria-pressed="false" title="AI 画笔：说一句话，让 AI 帮你画" aria-label="AI 画笔">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>AI</span>
  </button>
  <button class="tool" id="tPen" aria-pressed="true" title="画笔 (B)" aria-label="画笔">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.6 7.6"/><circle cx="11" cy="11" r="2"/></svg>
  </button>
  <button class="tool" id="tHand" aria-pressed="false" title="移动 (H 或按住空格)" aria-label="移动">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg>
  </button>
  <div class="sep"></div>
  <div id="colors"></div>
  <div class="sep"></div>
  <div id="sizes" style="display:flex"></div>
  <div class="sep"></div>
  <button class="tool" id="tUndo" title="撤销我的上一笔 (⌘/Ctrl+Z)" aria-label="撤销">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
  </button>
</div>

<div id="mod" class="card" hidden>
  <header><div id="modTabs"><button data-tab="recent" class="on">最近新增</button><button data-tab="mod">被处罚的人</button></div><button id="modClose" aria-label="关闭">✕</button></header>
  <div id="modList"></div>
</div>

<div id="ai" class="card" hidden>
  <textarea id="aiQ" maxlength="200" placeholder="说说你想画什么，或者此刻的心情…"></textarea>
  <div class="sugs" id="aiSugs"></div>
  <div class="row"><span class="hint">AI 会画在中间的虚线框里，只能画在空白处</span><button id="aiGo">开始画</button></div>
</div>

<div id="agent" class="card" hidden>
  <h2>🤖 接入你的 Agent</h2>
  <p>把下面的地址加到 Claude、ChatGPT 等支持 MCP 的 AI 助手里，它就能以「<span id="agName"></span> 的 Agent」的身份来画布上找空地、看看别人画了什么、自己画一幅。</p>
  <p>它画的内容算在你名下，被举报处罚也会算到你身上。只能画在空白处，每小时最多 10 幅。</p>
  <div id="agBody">
    <div class="acts" style="justify-content:flex-start"><button class="go" id="agGen">生成我的接入地址</button></div>
  </div>
  <div class="acts"><button id="agOff" hidden>停用</button><button id="agClose">关闭</button></div>
</div>

<div id="toast" class="card"></div>

<script>
(() => {
  'use strict';
  const CHUNK = 2048, MINZ = 0.1, MAXZ = 8, DRAWZ = 0.25, PAPER = '#fbfaf7';
  const COLORS = ['#1b1b1f', '#e5484d', '#f76b15', '#ffc53d', '#30a46c', '#0090ff', '#8e4ec6', '#e93d82'];
  const SIZES = [3, 7, 16]; // 屏幕像素

  const $ = (id) => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const rid = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => (b % 36).toString(36)).join('');
  const r2 = (v) => Math.round(v * 100) / 100;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // ---------- 身份 ----------
  let uid = store.get('wc.uid');
  if (!uid) { uid = rid(20); store.set('wc.uid', uid); }
  let myName = store.get('wc.name') || '旅人' + Math.floor(1000 + Math.random() * 9000);
  store.set('wc.name', myName);
  const me = { id: null, h: '#bbb' };
  $('myname').textContent = myName;

  // ---------- 视图 ----------
  let W = 0, H = 0, dpr = 1;
  const view = { x: 0, y: 0, z: 1 }; // x,y 为屏幕中心的世界坐标
  const s2w = (sx, sy) => [(sx - W / 2) / view.z + view.x, (sy - H / 2) / view.z + view.y];
  const w2s = (x, y) => [(x - view.x) * view.z + W / 2, (y - view.y) * view.z + H / 2];

  function readHash() {
    const m = location.hash.slice(1).split(',').map(Number);
    if (m.length >= 2 && m.every(Number.isFinite)) {
      view.x = clamp(m[0], -1e8, 1e8); view.y = clamp(m[1], -1e8, 1e8);
      if (m[2]) view.z = clamp(m[2], MINZ, MAXZ);
      return true;
    }
    return false;
  }
  // 没带位置链接进来的人，连上后由服务器分配一块空地；在那之前先停在随机处，不暴露任何“原点”
  let needEntry = !readHash();
  if (needEntry) { view.x = (Math.random() - 0.5) * 2e5; view.y = (Math.random() - 0.5) * 2e5; }
  addEventListener('hashchange', () => { if (readHash()) changed(true); });

  let dirty = true, hashTimer = 0, syncTimer = 0;
  function changed(skipHash) {
    dirty = true;
    $('pos').textContent = `x ${Math.round(view.x)} · y ${Math.round(view.y)} · ${Math.round(view.z * 100)}%`;
    if (!syncTimer) syncTimer = setTimeout(() => { syncTimer = 0; fly ? syncView(fly, true) : syncView(); }, 120);
    if (!skipHash) {
      clearTimeout(hashTimer);
      hashTimer = setTimeout(() => {
        history.replaceState(null, '', `#${Math.round(view.x)},${Math.round(view.y)},${view.z.toFixed(2)}`);
      }, 400);
    }
  }
  function zoomAt(sx, sy, f) {
    const [wx, wy] = s2w(sx, sy);
    view.z = clamp(view.z * f, MINZ, MAXZ);
    view.x = wx - (sx - W / 2) / view.z;
    view.y = wy - (sy - H / 2) / view.z;
    changed();
  }
  let fly = null;
  function flyTo(x, y, z) {
    fly = { x0: view.x, y0: view.y, z0: view.z, x, y, z: z ?? view.z, t0: performance.now(), d: 700 };
    syncView(fly, true); // 起飞就开始加载目的地
    dirty = true;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);

    if (!dirty) return;
    dirty = false;

    const z = view.z, hw = W / 2 / z, hh = H / 2 / z;
    const L = view.x - hw, T = view.y - hh, R = view.x + hw, B = view.y + hh;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);

    // 点阵网格
    let step = 64; while (step * z < 24) step *= 4; while (step * z > 96) step /= 4;
    ctx.fillStyle = '#dcd8cf';
    for (let x = Math.floor(L / step) * step; x <= R; x += step) {
      const sx = Math.round((x - view.x) * z + W / 2);
      for (let y = Math.floor(T / step) * step; y <= B; y += step) {
        ctx.fillRect(sx - 1, Math.round((y - view.y) * z + H / 2) - 1, 2, 2);
      }
    }

    ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * (W / 2 - view.x * z), dpr * (H / 2 - view.y * z));
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const vis = [];
    for (const s of strokes.values()) {
      if (s.b[0] > R || s.b[2] < L || s.b[1] > B || s.b[3] < T) continue;
      vis.push(s);
    }
    vis.sort((a, b) => a.id - b.id);
    for (const s of vis) path(s.p, s.w, s.c);
    if (ghosts.length) { ctx.globalAlpha = 0.35; for (const s of ghosts) path(s.p, s.w, s.c); ctx.globalAlpha = 1; }
    for (const s of live.values()) path(s.p, s.w, s.c);
    for (const s of pending.values()) path(s.p, s.w, s.c);
    if (cur) path(cur.p, cur.w, cur.c);

    // AI 画框：自己正在输入时是屏幕中间的框；生成中（自己的和别人的）固定在世界坐标里
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const box = (sx, sy, sw, label, col) => {
      ctx.save();
      ctx.setLineDash([7, 6]); ctx.lineWidth = 1.5; ctx.strokeStyle = col;
      ctx.strokeRect(sx, sy, sw, sw);
      ctx.setLineDash([]);
      if (label) {
        ctx.font = '600 12px -apple-system, "PingFang SC", sans-serif'; ctx.textBaseline = 'bottom'; ctx.textAlign = 'left';
        const t = label.length > 40 ? label.slice(0, 40) + '…' : label;
        ctx.fillStyle = col; ctx.fillText('✨ ' + t, sx, sy - 6);
      }
      ctx.restore();
    };
    if (!$('ai').hidden && !aiJob) { const b = aiFrame(); const [sx, sy] = w2s(b.x, b.y); box(sx, sy, b.s * z, '', '#8e4ec6'); }
    // 模型先要想半分钟左右才落第一笔，这段时间显示「构思中」和秒数
    const status = (j) => j.drawing ? 'AI 正在画：' + j.q : `AI 正在构思「${j.q}」… ${Math.floor((now - j.t0) / 1000)} 秒`;
    if (aiJob) { const [sx, sy] = w2s(aiJob.x, aiJob.y); box(sx, sy, aiJob.s * z, status(aiJob), '#8e4ec6'); }
    for (const f of frames.values()) {
      const [sx, sy] = w2s(f.x, f.y);
      box(sx, sy, f.s * z, f.agent ? `${f.who} 正在画${f.q ? '：' + f.q : ''}` : f.who + ' 的 ' + status(f), f.h);
    }
    if (aiJob || frames.size) dirty = true;

    // 别人的光标
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = '600 12px -apple-system, "PingFang SC", sans-serif'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    for (const p of peers.values()) {
      const [sx, sy] = w2s(p.x, p.y);
      if (sx < -80 || sx > W + 80 || sy < -40 || sy > H + 40) continue;
      ctx.fillStyle = p.h; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 4, sy + 15); ctx.lineTo(sx + 8, sy + 9); ctx.lineTo(sx + 15, sy + 8); ctx.closePath();
      ctx.stroke(); ctx.fill();
      const tw = ctx.measureText(p.n).width;
      ctx.beginPath(); ctx.roundRect(sx + 12, sy + 16, tw + 14, 20, 10); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(p.n, sx + 19, sy + 26.5);
    }
  }
  function loop(now) { draw(now); requestAnimationFrame(loop); }

  // ---------- 输入 ----------
  let tool = 'pen', color = COLORS[0], size = SIZES[1], space = false;
  let cur = null;      // 正在画的一笔
  let gesture = null;  // {type:'draw'|'pan'|'pinch'|'wait', ...}
  const pts = new Map();

  function startStroke(e) {
    const [x, y] = s2w(e.clientX, e.clientY);
    cur = { sid: rid(8), c: color, w: r2(Math.max(0.2, size / view.z)), p: [r2(x), r2(y)], sent: 0, lx: e.clientX, ly: e.clientY,
      hold: e.pointerType === 'touch' ? performance.now() + 150 : 0 };
    gesture = { type: 'draw' };
    dirty = true;
  }
  function addPoint(sx, sy) {
    if (!cur) return;
    if (Math.hypot(sx - cur.lx, sy - cur.ly) < 1.5) return;
    cur.lx = sx; cur.ly = sy;
    const [x, y] = s2w(sx, sy);
    cur.p.push(r2(x), r2(y));
    dirty = true;
    if (cur.p.length >= 3900) { // 太长就自动分段
      const last = { clientX: sx, clientY: sy, pointerType: 'mouse' };
      finishStroke(); startStroke(last);
    }
  }
  function flushLive() {
    if (!cur || cur.p.length <= cur.sent || performance.now() < cur.hold) return;
    send({ t: 'draw', sid: cur.sid, c: cur.c, w: cur.w, p: cur.p.slice(cur.sent, cur.sent + 800) });
    cur.sent = Math.min(cur.p.length, cur.sent + 800);
  }
  setInterval(flushLive, 60);
  function finishStroke() {
    if (!cur) return;
    const s = cur; cur = null;
    if (s.p.length === 2) s.p.push(s.p[0], s.p[1]);
    pending.set(s.sid, s);
    send({ t: 'end', sid: s.sid, c: s.c, w: s.w, p: s.p });
    dirty = true;
  }
  function cancelStroke() {
    if (!cur) return;
    if (cur.sent) send({ t: 'cancel', sid: cur.sid });
    cur = null; dirty = true;
  }

  let lastCur = 0;
  function sendCursor(sx, sy) {
    const now = performance.now();
    if (now - lastCur < 45) return;
    lastCur = now;
    const [x, y] = s2w(sx, sy);
    send({ t: 'cur', x: r2(x), y: r2(y) });
  }

  cv.addEventListener('pointerdown', (e) => {
    try { cv.setPointerCapture(e.pointerId); } catch {}
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    fly = null;
    if (pts.size === 2) {
      cancelStroke();
      const [a, b] = [...pts.values()];
      gesture = { type: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      return;
    }
    if (pts.size > 2) return;
    if (tool === 'hand' || space || e.button === 1 || e.button === 2) {
      gesture = { type: 'pan', lx: e.clientX, ly: e.clientY };
      cv.classList.add('grabbing');
    } else if (e.button === 0 && tool === 'flag') {
      pts.delete(e.pointerId);
      flagAt(e.clientX, e.clientY);
      return;
    } else if (e.button === 0) {
      if (view.z < DRAWZ) { toast('离得太远了，放大到 25% 以上才能画'); gesture = { type: 'wait' }; return; }
      startStroke(e);
    }
    sendCursor(e.clientX, e.clientY);
  });
  cv.addEventListener('pointermove', (e) => {
    const pt = pts.get(e.pointerId);
    if (pt) { pt.x = e.clientX; pt.y = e.clientY; }
    if (e.pointerType !== 'touch' || pt) sendCursor(e.clientX, e.clientY);
    if (!gesture || !pt) return;
    if (gesture.type === 'pinch' && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      view.x -= (mx - gesture.mx) / view.z; view.y -= (my - gesture.my) / view.z;
      zoomAt(mx, my, d / gesture.d);
      gesture.d = d; gesture.mx = mx; gesture.my = my;
    } else if (gesture.type === 'pan') {
      view.x -= (e.clientX - gesture.lx) / view.z; view.y -= (e.clientY - gesture.ly) / view.z;
      gesture.lx = e.clientX; gesture.ly = e.clientY;
      changed();
    } else if (gesture.type === 'draw') {
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
      if (evs && evs.length) for (const ev of evs) addPoint(ev.clientX, ev.clientY);
      else addPoint(e.clientX, e.clientY);
    }
  });
  function up(e) {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (!gesture) return;
    if (gesture.type === 'draw') { finishStroke(); gesture = null; }
    else if (gesture.type === 'pan') { gesture = null; cv.classList.remove('grabbing'); }
    else if (gesture.type === 'pinch' && pts.size === 1) { const [r] = [...pts.values()]; gesture = { type: 'pan', lx: r.x, ly: r.y }; }
    else if (pts.size < 2) gesture = pts.size ? { type: 'wait' } : null;
    if (!pts.size && gesture && gesture.type === 'pan') { gesture = null; cv.classList.remove('grabbing'); }
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('contextmenu', (e) => e.preventDefault());

  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    fly = null;
    // 触控板：双指滚动=平移，捏合(ctrlKey)=缩放；鼠标滚轮=缩放
    const mouseWheel = e.deltaMode === 1 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 100 && Number.isInteger(e.deltaY));
    if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
    else if (mouseWheel) zoomAt(e.clientX, e.clientY, Math.exp(-Math.sign(e.deltaY) * 0.18));
    else { view.x += e.deltaX / view.z; view.y += e.deltaY / view.z; changed(); }
  }, { passive: false });

  function setTool(t) {
    tool = t;
    $('tPen').setAttribute('aria-pressed', t === 'pen');
    $('tHand').setAttribute('aria-pressed', t === 'hand');
    $('flagOn').hidden = t !== 'flag';
    cv.classList.toggle('hand', t === 'hand' || space);
    cv.classList.toggle('flag', t === 'flag');
  }
  function undo() {
    const ids = myStack.pop();
    if (!ids) { toast('没有可以撤销的笔画'); return; }
    for (const id of ids) send({ t: 'undo', id });
    if (ids.g) toast('撤掉了 AI 画的这一整幅');
  }
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('agent').hidden) { $('agent').hidden = true; return; }
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.code === 'Space') { space = true; cv.classList.add('hand'); e.preventDefault(); }
    else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    else if (e.key === 'b' || e.key === 'B') setTool('pen');
    else if (e.key === 'h' || e.key === 'H') setTool('hand');
    else if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) $('btnRandom').click();
    else if ((e.key === 'm' || e.key === 'M') && !e.metaKey && !e.ctrlKey) $('btnMine').click();
  });
  addEventListener('keyup', (e) => { if (e.code === 'Space') { space = false; cv.classList.toggle('hand', tool === 'hand'); } });

  // ---------- 界面 ----------
  const pick = (box, el) => { for (const b of box.children) b.setAttribute('aria-pressed', b === el); };
  COLORS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'sw'; b.style.background = c; b.setAttribute('aria-label', '颜色 ' + c); b.setAttribute('aria-pressed', i === 0);
    b.onclick = () => { color = c; pick($('colors'), b); setTool('pen'); };
    $('colors').appendChild(b);
  });
  SIZES.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'sz'; b.setAttribute('aria-label', '粗细 ' + s); b.setAttribute('aria-pressed', i === 1);
    const d = 5 + i * 5; b.innerHTML = `<i style="width:${d}px;height:${d}px"></i>`;
    b.onclick = () => { size = s; pick($('sizes'), b); setTool('pen'); };
    $('sizes').appendChild(b);
  });
  $('tPen').onclick = () => setTool('pen');
  $('tHand').onclick = () => setTool('hand');
  $('flagOn').onclick = () => setTool('pen');
  const more = $('more');
  function moreOpen(open) {
    more.hidden = !open; $('btnMore').setAttribute('aria-expanded', open);
    if (open) {
      const r = $('btnMore').getBoundingClientRect();
      more.style.top = (r.bottom + 8) + 'px'; more.style.right = Math.max(12, innerWidth - r.right) + 'px';
    }
  }
  $('btnMore').onclick = (e) => { e.stopPropagation(); moreOpen(more.hidden); };
  addEventListener('pointerdown', (e) => { if (!more.hidden && !more.contains(e.target) && e.target !== $('btnMore')) moreOpen(false); }, true);
  $('btnFlag').onclick = () => { moreOpen(false); setTool('flag'); };
  $('tUndo').onclick = undo;
  $('zin').onclick = () => zoomAt(W / 2, H / 2, 1.4);
  $('zout').onclick = () => zoomAt(W / 2, H / 2, 1 / 1.4);
  $('online').onclick = () => send({ t: 'who' });
  $('btnEmpty').onclick = () => { needEntry = false; send({ t: 'empty', x: view.x, y: view.y }); };
  let mineIdx = -1, mineSig = '';
  // 回音：别人在我的画旁边新添的笔画。有回音时「我的画」先带你去看回音，看完再回到平常的翻看
  let echoes = [], echoMax = 0;
  function showEcho() {
    const n = echoes.reduce((a, e) => a + e.people, 0);
    $('echoN').hidden = !n; $('echoN').textContent = n > 99 ? '99+' : n;
    $('btnMine').title = n ? '有人在你的画旁边添了东西，点一下去看 (M)' : '回到我画过的地方，再点一次看上一幅 (M)';
  }
  $('btnMine').onclick = () => {
    needEntry = false;
    const e = echoes.shift();
    if (!e) { send({ t: 'mine' }); return; }
    flyTo(e.x, e.y, clamp(Math.min(W, H) * 0.7 / e.span, MINZ, 2));
    const who = e.people > 1 ? `${e.people} 个人` : '有人';
    toast(`${who}在你的画旁边添了 ${e.n} 笔 · ${ago(Date.now() - e.ts)}${echoes.length ? `，还有 ${echoes.length} 处` : ''}`, 4000);
    if (!echoes.length) store.set('wc_echo_seen', String(echoMax));
    showEcho();
  };
  // 一直开着页面也能收到新回音（正在看回音时不刷新，免得列表被打乱）
  setInterval(() => { if (!echoes.length && ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'echo', since: Number(store.get('wc_echo_seen')) || 0 })); }, 5 * 60000);
  const seenWorks = []; // 最近看过的作品，随便逛逛时尽量不重复
  $('btnRandom').onclick = () => { needEntry = false; send({ t: 'random', skip: seenWorks }); };
  $('btnShare').onclick = async () => {
    const url = `${location.origin}${location.pathname}#${Math.round(view.x)},${Math.round(view.y)},${view.z.toFixed(2)}`;
    try { await navigator.clipboard.writeText(url); toast('位置链接已复制，发给朋友就能在这里碰面'); }
    catch { prompt('复制这个链接：', url); }
  };
  $('me').onclick = () => {
    const n = (prompt('给自己起个名字（别人会在你的光标旁看到）', myName) || '').trim().slice(0, 16);
    if (!n) return;
    myName = n; store.set('wc.name', n); $('myname').textContent = n;
    send({ t: 'hello', uid, name: n });
  };

  // ---------- AI 画笔 ----------
  const frames = new Map(); // 别人正在生成的 AI 画框
  let aiJob = null;         // 我正在生成的那一幅
  const SUGS = ['一只晒太阳的猫', '给远方的朋友一个拥抱', '今天有点累，但还想笑', '雨后的彩虹', '一棵开花的树'];
  for (const t of SUGS) {
    const b = document.createElement('button'); b.textContent = t;
    b.onclick = () => { $('aiQ').value = t; $('aiQ').focus(); };
    $('aiSugs').appendChild(b);
  }
  // 画框放在输入卡片上方的空处（卡片收起时就是屏幕中间）
  function aiFrame() {
    const top = 70, card = $('ai');
    const bot = card.hidden ? H - 80 : card.getBoundingClientRect().top - 14;
    const px = Math.max(120, Math.min(Math.min(W, H) * 0.5, W - 32, bot - top));
    const s = clamp(px / view.z, 150, 6000);
    const [cx, cy] = s2w(W / 2, (top + bot) / 2);
    return { x: cx - s / 2, y: cy - s / 2, s };
  }
  function aiOpen(open) {
    $('ai').hidden = !open;
    $('tAI').setAttribute('aria-pressed', open);
    if (open) setTimeout(() => $('aiQ').focus(), 0);
    dirty = true;
  }
  function aiEnd() { aiJob = null; $('aiGo').disabled = false; $('aiGo').textContent = '开始画'; dirty = true; }
  function aiGo() {
    const q = $('aiQ').value.trim();
    if (!q) { toast('先写一句想画的内容'); return; }
    if (view.z < DRAWZ) { toast('离得太远了，放大到 25% 以上才能画'); return; }
    if (aiJob) return;
    const b = aiFrame();
    aiJob = { ...b, q, t0: performance.now(), drawing: false };
    if (!send({ t: 'ai', q, x: r2(b.x), y: r2(b.y), s: r2(b.s) })) { aiJob = null; return; }
    $('aiGo').disabled = true; $('aiGo').textContent = '正在画…';
    aiOpen(false);
    toast('AI 先构思半分钟左右，然后会一笔一笔画出来', 5000);
  }
  $('tAI').onclick = () => aiOpen($('ai').hidden);
  $('aiGo').onclick = aiGo;
  $('aiQ').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); aiGo(); }
    else if (e.key === 'Escape') aiOpen(false);
  });

  // ---------- Agent 接入 ----------
  function field(label, text) {
    const d = document.createElement('div'); d.className = 'field';
    const b = document.createElement('b'); b.textContent = label;
    const row = document.createElement('div'); row.className = 'copy';
    const c = document.createElement(text.includes('\n') ? 'pre' : 'code'); c.textContent = text;
    const btn = document.createElement('button'); btn.className = 'cp'; btn.textContent = '复制';
    btn.onclick = async () => { try { await navigator.clipboard.writeText(text); btn.textContent = '已复制'; setTimeout(() => (btn.textContent = '复制'), 1500); } catch { prompt('复制：', text); } };
    row.append(c, btn); d.append(b, row); return d;
  }
  function renderAgent(m) {
    const body = $('agBody');
    if (m.why) { toast({ ban: '你被多人举报，24 小时内不能接入 Agent', quota: '今天生成次数太多了，明天再来', bad: '还没连上，稍等再试' }[m.why] || '生成失败', 4000); return; }
    if (m.revoked) { body.textContent = ''; body.append(Object.assign(document.createElement('p'), { textContent: '已停用。之前给出的地址都失效了，需要时可以重新生成。' })); $('agOff').hidden = true; agentGenButton(); return; }
    const mcp = `${location.origin}/mcp/${m.key}`;
    body.textContent = '';
    const warn = document.createElement('p'); warn.textContent = '⚠️ 这个地址只显示这一次，相当于你的画笔钥匙，不要公开分享。弄丢了就重新生成，旧的会立即失效。';
    body.append(
      warn,
      field('MCP 地址（Claude / ChatGPT 的「自定义连接器」里填这个）', mcp),
      field('Claude Code 一行命令', `claude mcp add --transport http world-canvas ${mcp}`),
      field('直接调用 HTTP API（任何 Agent 或脚本）', `curl -H "Authorization: Bearer ${m.key}" ${location.origin}/api/blank`),
    );
    const doc = document.createElement('p'); doc.innerHTML = '接口说明见 <a href="/llms.txt" target="_blank" rel="noopener">/llms.txt</a>。接好后对你的助手说：「去无界画布找块空地，画一只晒太阳的猫」。';
    body.append(doc);
    $('agOff').hidden = false;
  }
  function agentGenButton() {
    const a = document.createElement('div'); a.className = 'acts'; a.style.justifyContent = 'flex-start';
    const b = document.createElement('button'); b.className = 'go'; b.textContent = '生成我的接入地址'; b.onclick = () => send({ t: 'agentkey' });
    a.append(b); $('agBody').append(a);
  }
  $('agGen').onclick = () => send({ t: 'agentkey' });
  $('btnAgent').onclick = () => { moreOpen(false); $('agName').textContent = myName; $('agent').hidden = false; };
  $('agClose').onclick = () => { $('agent').hidden = true; };
  $('agOff').onclick = () => { if (confirm('停用后，你的 Agent 就不能再来画了。之前的地址全部失效。确定吗？')) send({ t: 'agentrevoke' }); };

  let toastTimer = 0;
  function toast(msg, ms = 2600) {
    const t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), ms);
  }

  resize();
  connect();
  requestAnimationFrame(loop);
  const touchy = matchMedia('(pointer: coarse)').matches;
  if (touchy ? !store.get('wc.seen.touch') : !store.get('wc.seen')) {
    store.set('wc.seen', '1'); store.set('wc.seen.touch', '1');
    setTimeout(() => toast(touchy ? '一根手指画画 · 两根手指移动和缩放' : '拖动就能画 · 按住空格拖动移动 · 滚轮缩放', 7000), 600);
  }
})();
</script>
</body>
</html>
