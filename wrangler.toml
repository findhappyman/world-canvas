name = "world-canvas"
main = "src/index.js"
compatibility_date = "2025-04-01"
workers_dev = true

[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World"]

[[routes]]
pattern = "canvas.findhappyman.com"
custom_domain = true

# AI 画笔用 Cloudflare Workers AI，不需要额外的 API key
[ai]
binding = "AI"

[vars]
AI_ENABLED = "0"  # 暂时下线：生成太慢（常超过 70 秒），管理员仍可用
